<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Quote</title>
  </head>
  <body>
    <article class="card card--quote" style="--background:#E5E0D8; --ink:#171717; --accent:#C94B32;">
      <header class="card__masthead"><span class="card__brand">YOUR MAGAZINE</span><span class="card__section">QUOTE</span></header>
      <section class="card__quote-wrap">
        <p class="card__quote">“모든 카드가<br>말을 많이 할<br>필요는 없다.”</p>
        <p class="card__attribution">이름 · 직함 또는 인터뷰명<br>날짜와 원문 출처를 확인합니다</p>
      </section>
      <footer class="card__footer"><span class="card__source">직접 인용만 사용</span><span class="card__page">06</span></footer>
    </article>
  </body>
</html>

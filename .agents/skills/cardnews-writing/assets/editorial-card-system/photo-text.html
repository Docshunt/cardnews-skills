<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Photo + Text</title>
  </head>
  <body>
    <article class="card card--photo-text" style="--accent:#F0BE6E; --image-position:center;">
      <img class="card__photo" src="photo.jpg" alt="이야기의 주인공 또는 핵심 증거가 담긴 사진">
      <div class="card__scrim"></div>
      <header class="card__masthead"><span class="card__brand">YOUR MAGAZINE</span><span class="card__section">EVIDENCE</span></header>
      <section class="card__article">
        <p class="card__eyebrow">사진이 보여주는 사실</p>
        <h1 class="card__title">인물과<br>근거를<br>크게 남긴다.</h1>
        <p class="card__copy">사진은 분위기용 배경이 아니라 이야기의 증거여야 합니다.</p>
      </section>
      <footer class="card__footer"><span class="card__source">Photo © 출처 또는 제공자</span><span class="card__page">05</span></footer>
    </article>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Text</title>
  </head>
  <body>
    <article class="card card--text" style="--background:#F6F2EA; --ink:#171717; --accent:#C94B32;">
      <header class="card__masthead"><span class="card__brand">YOUR MAGAZINE</span><span class="card__section">STORY</span></header>
      <section class="card__article">
        <p class="card__eyebrow">무슨 일이 있었나</p>
        <h1 class="card__title">한 카드가<br>한 문단이 되게<br>씁니다.</h1>
        <p class="card__copy">사실을 길게 나열하지 않습니다. 필요한 장면과 정보를 짧은 문장으로 이어서, 다음 문단을 읽고 싶게 만듭니다.</p>
        <p class="card__copy">문장이 길어지면 글자를 줄이지 말고 다음 카드로 넘깁니다.</p>
      </section>
      <footer class="card__footer"><span class="card__source">출처 또는 맥락 표기</span><span class="card__page">04</span></footer>
    </article>
  </body>
</html>

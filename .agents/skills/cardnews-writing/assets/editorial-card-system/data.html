<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Data</title>
  </head>
  <body>
    <article class="card card--data" style="--background:#F6F2EA; --ink:#171717; --accent:#C94B32;">
      <header class="card__masthead"><span class="card__brand">YOUR MAGAZINE</span><span class="card__section">DATA</span></header>
      <section class="card__data-wrap">
        <p class="card__eyebrow">근거 하나만 남깁니다</p>
        <p class="card__metric">72%</p>
        <p class="card__metric-label">숫자는 한 카드에<br>하나의 질문만 답합니다.</p>
        <div class="card__bar" style="--before:28fr; --after:72fr;"><span class="card__bar-before"></span><span class="card__bar-after"></span></div>
        <p class="card__context">수치의 기준, 기간, 비교 대상과 의미를 짧게 설명합니다.</p>
      </section>
      <footer class="card__footer"><span class="card__source">출처 · 기준일 · 표본</span><span class="card__page">07</span></footer>
    </article>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Cover</title>
  </head>
  <body>
    <article class="card card--cover" style="--background:#F6F2EA; --ink:#171717; --accent:#C94B32;">
      <!-- For an image-led cover, add `is-photo`, then place card__photo and card__scrim directly inside this article. -->
      <header class="card__masthead"><span class="card__brand">YOUR MAGAZINE</span><span class="card__section">IDEAS</span></header>
      <div class="card__cover-copy">
        <p class="card__eyebrow">한 문장 주장</p>
        <h1 class="card__title">이 카드가<br><strong>말하려는 것</strong>은<br>무엇인가</h1>
      </div>
      <footer class="card__footer"><span>짧은 부제는 생략해도 됩니다</span><span class="card__page">01</span></footer>
    </article>
  </body>
</html>

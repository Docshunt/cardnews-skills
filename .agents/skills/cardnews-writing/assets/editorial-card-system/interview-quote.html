<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <link rel="stylesheet" href="card.css">
    <title>Interview quote</title>
  </head>
  <body>
    <article class="card card--paper card--interview-quote" style="--photo-position:center;">
      <figure class="quote__photo-frame">
        <img class="card__photo" src="photo.jpg" alt="인용한 사람이 등장한 인터뷰 또는 현장 사진">
      </figure>
      <blockquote class="quote__body">
        <p>“좋은 디자인은<br>아트와 비즈니스의 경계에서<br>해답을 찾는 일입니다.”</p>
      </blockquote>
    </article>
  </body>
</html>
